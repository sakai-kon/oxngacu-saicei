<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>標準音楽プレイヤー (Oxngacu Saicei)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player-container">
        <header>
            <h1>標準音楽プレイヤー</h1>
            <p class="subtitle">音楽再生 ＆ ダウンロード対応</p>
        </header>

        <div class="now-playing">
            <div class="album-art" id="albumArt">🎵</div>
            <h2 id="trackTitle">曲名を選択してください</h2>
            <p id="artistName">アーティスト名</p>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="time-info">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button id="prevBtn" title="前の曲">⏮</button>
            <button id="playBtn" title="再生/一時停止">▶</button>
            <button id="nextBtn" title="次の曲">⏭</button>
            <button id="downloadBtn" title="ダウンロード">⬇️ ダウンロード</button>
        </div>

        <div class="volume-container">
            <span>🔊</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
        </div>

        <div class="playlist-section">
            <h3>プレイリスト</h3>
            <ul id="playlist">
                <!-- プレイリストアイテムはJavaScriptで動的に追加されます -->
            </ul>
        </div>
        
        <div class="upload-section">
            <label for="audioLoader" class="file-upload-btn">📁 音楽ファイルを追加</label>
            <input type="file" id="audioLoader" accept="audio/*" multiple style="display: none;">
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
