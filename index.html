<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="iTunes Search APIを使ったシンプルな音楽検索サイト。曲名やアーティスト名から楽曲を探せます。">
  <title>Music Search — 音楽を探す</title>
  <link rel="preconnect" href="https://itunes.apple.com">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Music Search ホーム">
      <span class="brand-mark" aria-hidden="true">♪</span>
      <span>music<span class="brand-light">search</span></span>
    </a>
    <span class="header-note">POWERED BY ITUNES SEARCH API</span>
  </header>

  <main class="page-shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">YOUR MUSIC, ONE SEARCH AWAY</p>
      <h1 id="page-title">聴きたい曲を、<span>すぐに。</span></h1>
      <p class="hero-copy">曲名やアーティスト名を入力して、音楽を探してみよう。</p>

      <form id="search-form" class="search-form" role="search">
        <label class="sr-only" for="search-input">曲名またはアーティスト名</label>
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input
          id="search-input"
          name="q"
          type="search"
          placeholder="曲名・アーティスト名で検索"
          autocomplete="off"
          maxlength="120"
          required
        >
        <button id="search-button" type="submit">
          <span>検索</span>
          <span aria-hidden="true">→</span>
        </button>
      </form>

      <div class="suggestions" aria-label="検索例">
        <span class="suggestions-label">POPULAR SEARCHES</span>
        <button class="suggestion" type="button" data-query="only my railgun">only my railgun</button>
        <button class="suggestion" type="button" data-query="残酷な天使のテーゼ">残酷な天使のテーゼ</button>
        <button class="suggestion" type="button" data-query="ブルーバード">ブルーバード</button>
        <button class="suggestion" type="button" data-query="君の知らない物語">君の知らない物語</button>
      </div>
    </section>

    <section class="results-section" aria-labelledby="results-heading">
      <div class="results-heading-row">
        <div>
          <p class="section-kicker">DISCOVER MUSIC</p>
          <h2 id="results-heading">検索結果</h2>
        </div>
        <span id="result-count" class="result-count" aria-live="polite"></span>
      </div>

      <div id="status" class="status" role="status" aria-live="polite">
        <span class="status-icon" aria-hidden="true">♫</span>
        <strong>音楽を探してみよう</strong>
        <span>上の検索ボックスから曲名やアーティスト名を検索できます。</span>
      </div>

      <div id="results" class="results-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <span>Music Search</span>
    <span>Music metadata provided by the iTunes Search API.</span>
    <span>試聴音源は利用可能な楽曲のみ表示されます。</span>
  </footer>
</body>
</html>
